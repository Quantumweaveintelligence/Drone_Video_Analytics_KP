services:

  postgres:
    image: postgres:16-alpine
    container_name: dvas_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dvas
      POSTGRES_PASSWORD: dvas_secret
      POSTGRES_DB: dvas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvas -d dvas"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  backend:
    build: ./backend
    container_name: dvas_backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dvas:dvas_secret@postgres:5432/dvas
      - JWT_SECRET=super-secret-dvas-key-change-in-prod
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - INGEST_SERVER_URL=http://drone_nginx
      - EDGE_SERVER_URL=http://edge:8765
      - ANALYTICS_GATEWAY_URL=http://analytics-gateway:8100
      - CROWD_ANALYTICS_URL=http://crowd-analyzer:8101
      - PERSON_ANALYTICS_URL=http://person-analyzer:8102
      - VEHICLE_ANALYTICS_URL=http://vehicle-analyzer:8103
      - ANPR_ANALYTICS_URL=http://anpr-analyzer:8104
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - KEYCLOAK_URL=http://keycloak:8080
      - KC_REALM=kerala-police-drone
      - KC_CLIENT_ID=drone-ingest-client
      - ADMIN_CLIENT_ID=dvas-admin-service
      - ADMIN_CLIENT_SECRET=MvusAlJk9DMnfe6GVOwuni8ODQbES938
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - drone-net

  edge:
    build: ../dvas_edge
    container_name: dvas_edge
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "8765:8765"
    volumes:
      - edge_buffer:/app/buffer_storage
      - ../videos:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - INGEST__ENABLED=true
      - INGEST__DRONE_ID=DRN-004
      - INGEST__CLIENT_SECRET=yNa0AfA0mToUmhQHSiM2vjAyYud6NSMn
      - INGEST__URL=http://drone_nginx/ingest/frame
      - INGEST__TOKEN_URL=http://keycloak:8080/realms/kerala-police-drone/protocol/openid-connect/token
      - INGEST__MISSION_START_URL=http://drone_nginx/ingest/mission/start
      - INGEST__MISSION_END_URL=http://drone_nginx/ingest/mission/end
      - INGEST__TLS_VERIFY=false
    networks:
      - default
      - drone-net

  frontend:
    build: ./frontend
    container_name: dvas_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - edge
    networks:
      - default

networks:
  default:
  drone-net:
    name: dvas_ingest_drone-net
    external: true

volumes:
  pgdata:
  edge_buffer:
