services:
  postgres:
    image: postgres:16-alpine
    container_name: dvas_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dvas
      POSTGRES_PASSWORD: dvas_secret
      POSTGRES_DB: dvas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvas -d dvas"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  backend:
    build: ./backend
    container_name: dvas_backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dvas:dvas_secret@postgres:5432/dvas
      - JWT_SECRET=super-secret-dvas-key-change-in-prod
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://10.235.245.250:3000,http://10.51.27.155:3000,http://10.51.27.250:3000
      - INGEST_SERVER_URL=http://drone_ingest_api:8000
      - EDGE_SERVER_URL=http://edge:8765
      - ANALYTICS_GATEWAY_URL=http://host.docker.internal:8100
      - CROWD_ANALYTICS_URL=http://host.docker.internal:8101
      - PERSON_ANALYTICS_URL=http://host.docker.internal:8102
      - VEHICLE_ANALYTICS_URL=http://host.docker.internal:8103
      - ANPR_ANALYTICS_URL=http://host.docker.internal:8104
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - drone-net

  edge:
    build: ../dvas_edge
    container_name: dvas_edge
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ../dvas_edge/DJI_0110.MP4:/data/DJI_0110.MP4:ro
      - ../dvas_edge/DJI_0111.MP4:/data/DJI_0111.MP4:ro
      - ../dvas_edge/DJI_0112.MP4:/data/DJI_0112.MP4:ro
      - ../dvas_edge/DJI_0113.mp4:/data/DJI_0113.mp4:ro
      - edge_buffer:/app/buffer_storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VIDEO_DIR=/data
      - SIMULATION__ENABLED=true
      - INGEST__ENABLED=true
      - INGEST__DRONE_ID=DRN-004
      - KC_CLIENT_SEC=yNa0AfA0mToUmhQHSiM2vjAyYud6NSMn
      - INGEST__URL=http://drone_ingest_api:8000/ingest/frame
      - INGEST_URL=http://drone_ingest_api:8000/ingest/frame
      - TOKEN_URL=http://drone_keycloak:8080/realms/kerala-police-drone/protocol/openid-connect/token
      - MISSION_START_URL=http://drone_ingest_api:8000/ingest/mission/start
      - MISSION_END_URL=http://drone_ingest_api:8000/ingest/mission/end
      - TLS_VERIFY=false
    networks:
      - default
      - drone-net

  frontend:
    build: ./frontend
    container_name: dvas_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - edge
    networks:
      - default

networks:
  default:
  drone-net:
    name: dvas_ingest_drone-net
    external: true

volumes:
  pgdata:
  edge_buffer:
