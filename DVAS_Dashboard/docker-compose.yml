services:
  postgres:
    image: postgres:16-alpine
    container_name: dvas_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dvas
      POSTGRES_PASSWORD: dvas_secret
      POSTGRES_DB: dvas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvas -d dvas"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: dvas_backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql+asyncpg://dvas:dvas_secret@postgres:5432/dvas
      - JWT_SECRET=super-secret-dvas-key-change-in-prod
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://10.51.27.155:3000,http://10.51.27.250:3000
      # Ingest server runs on the same machine — access via host IP
      - INGEST_SERVER_URL=http://10.51.27.250:8000
      # Edge runs on the remote teammate laptop
      - EDGE_SERVER_URL=http://10.51.27.155:8765
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: dvas_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
