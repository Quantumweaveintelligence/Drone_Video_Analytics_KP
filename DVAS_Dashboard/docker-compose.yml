services:
  postgres:
    image: postgres:16-alpine
    container_name: dvas_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dvas
      POSTGRES_PASSWORD: dvas_secret
      POSTGRES_DB: dvas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvas -d dvas"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: dvas_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dvas:dvas_secret@postgres:5432/dvas
      - JWT_SECRET=super-secret-dvas-key-change-in-prod
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy

  edge:
    build: ../dvas_edge
    container_name: dvas_edge
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ../dvas_edge/DJI_0110.MP4:/data/DJI_0110.MP4:ro
      - ../dvas_edge/DJI_0111.MP4:/data/DJI_0111.MP4:ro
      - edge_buffer:/app/buffer_storage
    environment:
      - VIDEO_DIR=/data
      - SIMULATION__ENABLED=true
      - INGEST__ENABLED=false

  frontend:
    build: ./frontend
    container_name: dvas_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - edge

volumes:
  pgdata:
  edge_buffer:
