# Prometheus alerting rules for DVAS Ingest Server
# File: monitoring/rules/dvas_alerts.yml

groups:
  - name: dvas_ingest
    rules:

      # ── Ingest API down ───────────────────────────────────────────────────
      - alert: IngestAPIDown
        expr: up{job="ingest-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ingest API is down"
          description: "The FastAPI ingest container has been unreachable for > 1 minute."

      # ── Valkey queue depth growing unbounded ──────────────────────────────
      # Fires when GPU consumer is falling behind intake rate.
