name: dvas_ingest
services:
  alertmanager:
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    container_name: drone_alertmanager
    image: prom/alertmanager:latest
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9093
        published: "9093"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/monitoring/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: true
  analytics-gateway:
    build:
      context: /media/user/New Volume/POLICE_DRONE/dvas_analytics
      dockerfile: gateway/Dockerfile
    container_name: drone_analytics_gateway
    depends_on:
      anpr-analyzer:
        condition: service_healthy
        required: true
      crowd-analyzer:
        condition: service_healthy
        required: true
      person-analyzer:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      valkey:
        condition: service_healthy
        required: true
      vehicle-analyzer:
        condition: service_healthy
        required: true
    environment:
      ANPR_URL: http://anpr-analyzer:8104
      CROWD_URL: http://crowd-analyzer:8101
      DATABASE_URL: postgresql://dvas:dvas_secret@postgres:5432/dvas?sslmode=disable
      DRONE_IDS: DRONE_KL_001,DRONE_KL_002,DRONE_KL_003,DRONE_KL_004,DRONE_KL_005,DRN-001,DRN-002,DRN-003,DRN-004,DRN-005
      LOG_LEVEL: INFO
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: minio:9000
      MINIO_SECRET_KEY: minioadmin
      PERSON_URL: http://person-analyzer:8102
      REDIS_URL: redis://valkey:6379/0
      VEHICLE_URL: http://vehicle-analyzer:8103
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8100/health
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 30s
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8100
        published: "8100"
        protocol: tcp
    restart: unless-stopped
  anpr-analyzer:
    build:
      context: /media/user/New Volume/POLICE_DRONE/dvas_analytics
      dockerfile: anpr/Dockerfile
    container_name: drone_anpr_analyzer
    depends_on:
      minio:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      valkey:
        condition: service_healthy
        required: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              count: 1
    environment:
      BUCKET_EVIDENCE: dvas-evidence
      BUCKET_FACES: dvas-faces
      BUCKET_HEATMAPS: dvas-heatmaps
      BUCKET_PLATES: dvas-plates
      BUCKET_VEHICLES: dvas-vehicles
      DATABASE_URL: postgresql://dvas:dvas_secret@postgres:5432/dvas?sslmode=disable
      DRONE_IDS: DRONE_KL_001,DRONE_KL_002,DRONE_KL_003,DRONE_KL_004,DRONE_KL_005,DRN-001,DRN-002,DRN-003,DRN-004,DRN-005
      LOG_LEVEL: INFO
      LP_MODEL: /analytics/anpr/models/license_plate_detector.pt
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://10.51.27.250:9000
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      REDIS_URL: redis://valkey:6379/0
      VEHICLE_MODEL: /analytics/anpr/models/visdrone.pt
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8104/health
      timeout: 15s
      interval: 30s
      retries: 5
      start_period: 3m0s
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8104
        published: "8104"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: analytics_evidence
        target: /data/evidence
        volume: {}
  crowd-analyzer:
    build:
      context: /media/user/New Volume/POLICE_DRONE/dvas_analytics
      dockerfile: crowd/Dockerfile
    container_name: drone_crowd_analyzer
    depends_on:
      minio:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      valkey:
        condition: service_healthy
        required: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              count: 1
    environment:
      BUCKET_EVIDENCE: dvas-evidence
      BUCKET_HEATMAPS: dvas-heatmaps
      CROWD_ALERT_THRESHOLD: "50"
      DATABASE_URL: postgresql://dvas:dvas_secret@postgres:5432/dvas?sslmode=disable
      DRONE_IDS: DRONE_KL_001,DRONE_KL_002,DRONE_KL_003,DRONE_KL_004,DRONE_KL_005,DRN-001,DRN-002,DRN-003,DRN-004,DRN-005
      LOG_LEVEL: INFO
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: minio:9000
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MODEL_PATH: /analytics/crowd/models/crowd_counting.pth
      REDIS_URL: redis://valkey:6379/0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8101/health')
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 1m0s
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8101
        published: "8101"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: analytics_evidence
        target: /data/evidence
        volume: {}
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    networks:
      drone-net: null
    restart: unless-stopped
  grafana:
    container_name: drone_grafana
    depends_on:
      prometheus:
        condition: service_started
        required: true
    environment:
      GF_SECURITY_ADMIN_PASSWORD: Grafana@KP2025!
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    image: grafana/grafana-oss:latest
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 3000
        published: "3001"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
        volume: {}
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: true
  headscale:
    command:
      - serve
    container_name: drone_headscale
    image: headscale/headscale:0.23.0
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8080
        published: "8081"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/headscale/config.yaml
        target: /etc/headscale/config.yaml
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/headscale/acl.json
        target: /etc/headscale/acl.json
        read_only: true
        bind:
          create_host_path: true
      - type: volume
        source: headscale_data
        target: /var/lib/headscale
        volume: {}
  ingest-api:
    build:
      context: /media/user/New Volume/POLICE_DRONE/dvas_ingest/ingest/api
      dockerfile: Dockerfile
    container_name: drone_ingest_api
    depends_on:
      keycloak:
        condition: service_healthy
        required: true
      valkey:
        condition: service_healthy
        required: true
    environment:
      JWKS_CACHE_TTL_S: "300"
      KC_CLIENT_ID: drone-ingest-client
      KC_REALM: kerala-police-drone
      KEYCLOAK_URL: http://keycloak:8080
      KNOWN_DRONES: DRONE_KL_001,DRONE_KL_002,DRONE_KL_003,DRONE_KL_004,DRONE_KL_005,DRN-001,DRN-002,DRN-003,DRN-004,DRN-005
      LOG_JSON: "true"
      LOG_LEVEL: INFO
      MAX_FRAME_MB: "5"
      QUEUE_MAX_LENGTH: "1000"
      QUEUE_MSG_TTL_MS: "30000"
      REDIS_URL: redis://valkey:6379/0
      SKIP_AUTH: "true"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8000
        published: "8000"
        protocol: tcp
    restart: unless-stopped
  keycloak:
    command:
      - start-dev
    container_name: drone_keycloak
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      KC_DB: postgres
      KC_DB_PASSWORD: B+FE6J5/uPVb+QSSLy8ZAKPE
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: ingest.dvas.internal
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Admin@KP2025!
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1
      timeout: 10s
      interval: 20s
      retries: 15
      start_period: 1m30s
    image: quay.io/keycloak/keycloak:24.0
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
  minio:
    command:
      - server
      - /data
      - --console-address
      - :9001
    container_name: drone_minio
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 10s
    image: minio/minio:latest
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 9000
        published: "9000"
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9001
        published: "9001"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: minio_data
        target: /data
        volume: {}
  minio-init:
    container_name: drone_minio_init
    depends_on:
      minio:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/sh
      - -c
      - |2
          mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
          mc mb --ignore-existing local/dvas-evidence &&
          mc mb --ignore-existing local/dvas-faces &&
          mc mb --ignore-existing local/dvas-plates &&
          mc mb --ignore-existing local/dvas-heatmaps &&
          mc mb --ignore-existing local/dvas-vehicles &&
          mc anonymous set download local/dvas-evidence &&
          echo '[minio-init] All buckets ready.'
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    image: minio/mc:latest
    networks:
      drone-net: null
    restart: on-failure
  nginx:
    container_name: drone_nginx
    depends_on:
      ingest-api:
        condition: service_healthy
        required: true
    image: nginx:alpine
    networks:
      drone-net: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 443
        published: "443"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/ingest/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/ingest/certs/ingest.crt
        target: /etc/ssl/certs/ingest.crt
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/ingest/certs/ingest.key
        target: /etc/ssl/private/ingest.key
        read_only: true
        bind:
          create_host_path: true
  person-analyzer:
    build:
      context: /media/user/New Volume/POLICE_DRONE/dvas_analytics
      dockerfile: person/Dockerfile
    container_name: drone_person_analyzer
    depends_on:
      minio:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      valkey:
        condition: service_healthy
        required: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              count: 1
    environment:
      BUCKET_EVIDENCE: dvas-evidence
      BUCKET_FACES: dvas-faces
      DATABASE_URL: postgresql://dvas:dvas_secret@postgres:5432/dvas?sslmode=disable
      DRONE_IDS: DRONE_KL_001,DRONE_KL_002,DRONE_KL_003,DRONE_KL_004,DRONE_KL_005,DRN-001,DRN-002,DRN-003,DRN-004,DRN-005
      FACE_MODEL: /analytics/person/models/yolov8n-face.pt
      LOG_LEVEL: INFO
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: minio:9000
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      PERSON_MODEL: /analytics/person/models/yolov8m.pt
      REDIS_URL: redis://valkey:6379/0
      REID_CLUSTER_INTERVAL: "50"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8102/health')
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 1m30s
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8102
        published: "8102"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: analytics_evidence
        target: /data/evidence
        volume: {}
  postgres:
    container_name: drone_postgres
    environment:
      DVAS_DB_PASSWORD: dvas_secret
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: B+FE6J5/uPVb+QSSLy8ZAKPE
      POSTGRES_USER: keycloak
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U keycloak -d keycloak
      timeout: 5s
      interval: 10s
      retries: 5
    image: postgres:16-alpine
    networks:
      drone-net: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_analytics/db/init.sh
        target: /docker-entrypoint-initdb.d/00_dvas_init.sh
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_analytics/db/migrations
        target: /docker-entrypoint-initdb.d/migrations
        read_only: true
        bind:
          create_host_path: true
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    container_name: drone_prometheus
    image: prom/prometheus:latest
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9090
        published: "9090"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/monitoring/rules
        target: /etc/prometheus/rules
        read_only: true
        bind:
          create_host_path: true
      - type: volume
        source: prometheus_data
        target: /prometheus
        volume: {}
  seaweedfs-filer:
    command:
      - filer
      - -master=seaweedfs-master:9333
    container_name: drone_seaweed_filer
    depends_on:
      seaweedfs-master:
        condition: service_started
        required: true
    image: chrislusf/seaweedfs:latest
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8888
        published: "8888"
        protocol: tcp
    restart: unless-stopped
  seaweedfs-master:
    command:
      - master
      - -volumeSizeLimitMB=1024
    container_name: drone_seaweed_master
    image: chrislusf/seaweedfs:latest
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9333
        published: "9333"
        protocol: tcp
    restart: unless-stopped
  seaweedfs-volume:
    command:
      - volume
      - -mserver=seaweedfs-master:9333
      - -dir=/data
      - -port=8080
    container_name: drone_seaweed_volume
    depends_on:
      seaweedfs-master:
        condition: service_started
        required: true
    image: chrislusf/seaweedfs:latest
    networks:
      drone-net: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: evidence_data
        target: /data
        volume: {}
  setup:
    container_name: drone_setup
    depends_on:
      keycloak:
        condition: service_healthy
        required: true
      valkey:
        condition: service_healthy
        required: true
    entrypoint:
      - sh
      - -c
      - |2
          pip install httpx --quiet &&
          python /scripts/setup_keycloak.py --url http://keycloak:8080 --no-wait
    image: python:3.11-slim
    networks:
      drone-net: null
    restart: on-failure
    volumes:
      - type: bind
        source: /media/user/New Volume/POLICE_DRONE/dvas_ingest/ingest/scripts
        target: /scripts
        read_only: true
        bind:
          create_host_path: true
  step-ca:
    container_name: drone_step_ca
    environment:
      DOCKER_STEPCA_INIT_ADDRESS: :9000
      DOCKER_STEPCA_INIT_DNS_NAMES: ingest.dvas.internal,localhost
      DOCKER_STEPCA_INIT_NAME: DVAS Internal CA
      DOCKER_STEPCA_INIT_PASSWORD: 4Uu3jbGzTQh6bo1W8os0UBhj
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sk https://localhost:9000/health | grep -q ok || exit 1
      timeout: 5s
      interval: 15s
      retries: 5
      start_period: 20s
    image: smallstep/step-ca:latest
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 9000
        published: "9002"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: step_data
        target: /home/step
        volume: {}
  valkey:
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    container_name: drone_valkey
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      timeout: 3s
      interval: 5s
      retries: 10
      start_period: 5s
    image: valkey/valkey:7-alpine
    networks:
      drone-net: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: valkey_data
        target: /data
        volume: {}
  vehicle-analyzer:
    build:
      context: /media/user/New Volume/POLICE_DRONE/dvas_analytics
      dockerfile: vehicle/Dockerfile
    container_name: drone_vehicle_analyzer
    depends_on:
      minio:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      valkey:
        condition: service_healthy
        required: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              count: 1
    environment:
      BUCKET_EVIDENCE: dvas-evidence
      BUCKET_VEHICLES: dvas-vehicles
      DATABASE_URL: postgresql://dvas:dvas_secret@postgres:5432/dvas?sslmode=disable
      DRONE_IDS: DRONE_KL_001,DRONE_KL_002,DRONE_KL_003,DRONE_KL_004,DRONE_KL_005,DRN-001,DRN-002,DRN-003,DRN-004,DRN-005
      LOG_LEVEL: INFO
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://10.51.27.250:9000
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      REDIS_URL: redis://valkey:6379/0
      VEHICLE_MODEL: /analytics/vehicle/models/visdrone.pt
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8103/health')
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 1m0s
    networks:
      drone-net: null
    ports:
      - mode: ingress
        host_ip: 0.0.0.0
        target: 8103
        published: "8103"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: analytics_evidence
        target: /data/evidence
        volume: {}
networks:
  drone-net:
    name: dvas_ingest_drone-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
volumes:
  analytics_evidence:
    name: dvas_ingest_analytics_evidence
    driver: local
  evidence_data:
    name: dvas_ingest_evidence_data
    driver: local
  grafana_data:
    name: dvas_ingest_grafana_data
    driver: local
  headscale_data:
    name: dvas_ingest_headscale_data
    driver: local
  minio_data:
