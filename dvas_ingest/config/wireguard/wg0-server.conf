# ══════════════════════════════════════════════════════════════════════════════
# WireGuard Gateway — Ubuntu Ingest Server
# File: config/wireguard/wg0-server.conf
#
# DEPLOYMENT INSTRUCTIONS:
#   1. Generate the server keypair on Ubuntu:
#        wg genkey | sudo tee /etc/wireguard/server-private.key | wg pubkey | sudo tee /etc/wireguard/server-public.key
#        sudo chmod 600 /etc/wireguard/server-private.key
#
#   2. Copy this file to /etc/wireguard/wg0.conf:
#        sudo cp config/wireguard/wg0-server.conf /etc/wireguard/wg0.conf
#
#   3. Fill in <PASTE_SERVER_PRIVATE_KEY_HERE> with the contents of
#        /etc/wireguard/server-private.key
#
#   4. Replace <ETH_INTERFACE> with your actual internet-facing interface name
#        (check with: ip route | grep default | awk '{print $5}')
#        Typically: eth0, ens3, enp3s0, etc.
#
#   5. Add a [Peer] block for each Windows laptop (see template below).
#        The laptop's public key is generated by WireGuard for Windows →
#        Add Tunnel → Generate, then shared by the field operator with this admin.
#
#   6. Enable IP forwarding (run once):
#        echo "net.ipv4.ip_forward = 1" | sudo tee -a /etc/sysctl.conf
#        sudo sysctl -p
#
#   7. Open firewall ports:
#        sudo ufw allow 51820/udp
#        sudo ufw allow from 10.10.20.0/24 to any port 443
#        sudo ufw allow from 10.10.20.0/24 to any port 8080
#        sudo ufw enable
#
#   8. Start the gateway:
#        sudo systemctl enable --now wg-quick@wg0
#
#   9. Verify:
#        sudo wg show
#        sudo systemctl status wg-quick@wg0
#
# IMPORTANT:
#   - NEVER commit the private key to version control.
#   - Server public key must be shared with each Windows laptop
#     (contents of /etc/wireguard/server-public.key).
#   - VPN subnet: 10.10.20.0/24
#     Ubuntu server = 10.10.20.1
#     Laptop 1      = 10.10.20.2
#     Laptop 2      = 10.10.20.3  ... and so on
# ══════════════════════════════════════════════════════════════════════════════

[Interface]
# Ubuntu server VPN IP — gateway address for all Windows laptops
Address    = 10.10.20.1/24
ListenPort = 51820

# Paste contents of /etc/wireguard/server-private.key here
PrivateKey = 8PwTktqn50LYCZ8YiFOKFZXAQ/hQ0LXqt+fGYgDlBF4=

# NAT masquerade — allows VPN clients to reach ingest services.
# Replace <ETH_INTERFACE> with your actual internet-facing interface (e.g. eth0, ens3).
PostUp   = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o wlp0s20f3 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o wlp0s20f3 -j MASQUERADE

# ── Peer template — copy and fill in for each Windows edge laptop ─────────────
# To register via Headscale instead, run:
#   docker compose exec headscale headscale nodes register --user dvas-edge --key <laptop-public-key>
# and skip adding peers here manually.
#
# [Peer]
# # Laptop 01 — Officer Name — DRONE_KL_001
# PublicKey           = <PASTE_LAPTOP_01_PUBLIC_KEY_HERE>
# AllowedIPs          = 10.10.20.2/32
#
# [Peer]
# # Laptop 02 — Officer Name — DRONE_KL_002
# PublicKey           = <PASTE_LAPTOP_02_PUBLIC_KEY_HERE>
# AllowedIPs          = 10.10.20.3/32
#
# [Peer]
# # Laptop 03 — Officer Name — DRONE_KL_003
# PublicKey           = <PASTE_LAPTOP_03_PUBLIC_KEY_HERE>
# AllowedIPs          = 10.10.20.4/32
