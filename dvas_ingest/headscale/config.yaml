# ══════════════════════════════════════════════════════════════════════════════
# Headscale Configuration — DVAS VPN Control Plane
# File: headscale/config.yaml  (headscale v0.23.0)
# ══════════════════════════════════════════════════════════════════════════════

# server_url MUST NOT contain base_domain (headscale rule).
# We use a plain IP here so there's no domain overlap.
# Replace with your actual public IP or FQDN that is NOT *.dvas.internal
server_url: http://100.64.0.1:8081

listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: true   # OK for internal-only deployment

# ── Database ──────────────────────────────────────────────────────────────────
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

# ── Keys ─────────────────────────────────────────────────────────────────────
private_key_path:       /var/lib/headscale/private.key
noise:
  private_key_path:     /var/lib/headscale/noise_private.key

# ── IP Allocation ─────────────────────────────────────────────────────────────
# Headscale requires the CGNAT range 100.64.0.0/10 (Tailscale protocol).
# Laptops will get IPs like 100.64.0.2, 100.64.0.3 etc.
prefixes:
  v4: 100.64.0.0/10
  allocation: sequential

# ── DERP ──────────────────────────────────────────────────────────────────────
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency:    24h

# ── DNS ───────────────────────────────────────────────────────────────────────
dns:
  magic_dns:          false
  base_domain:        dvas-vpn.internal   # Different from ingest.dvas.internal
  override_local_dns: false
  nameservers:
    global:
      - 8.8.8.8
      - 8.8.4.4

# ── Logging ───────────────────────────────────────────────────────────────────
log:
  format: text
  level:  info

# ── Policy (ACL) ──────────────────────────────────────────────────────────────
policy:
  mode: file
  path: /etc/headscale/acl.json
