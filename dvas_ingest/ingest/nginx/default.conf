# ── NGINX configuration for Kerala Police Drone Ingest Server ──────────────
#
# Machine: Ubuntu Ingest Server
# Hostname: ingest.dvas.internal (internal DNS / /etc/hosts on each laptop)
#
# Features:
#   - HTTP → HTTPS redirect (80 → 443)
#   - TLS 1.2 / 1.3 with step-ca issued certificate (replaces self-signed)
#   - Rate limiting: 30 frames/sec per source IP, burst 60 (nodelay)
#   - Early 401 rejection if Authorization header is absent (frame endpoint only)
#   - Proxy to FastAPI uvicorn on port 8000
#   - 10 MB client body limit (frame uploads)
#   - WebSocket upgrade support for /ws/status
#   - Gzip compression for JSON responses
# ──────────────────────────────────────────────────────────────────────────

# Rate limit zone — shared memory 10 MB, 30 requests/sec per source IP
limit_req_zone $binary_remote_addr zone=drone_ingest_limit:10m rate=30r/s;

upstream fastapi_backend {
    server ingest-api:8000;   # "ingest-api" = Docker Compose service name
    keepalive 32;             # Reuse connections to FastAPI
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen      80;
    server_name _;

    # Health check passthrough (plain HTTP for Docker/monitoring)
    location = /health {
        proxy_pass http://fastapi_backend/health;
        proxy_set_header Host $host;
    }

    # Everything else redirected to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    server_name ingest.dvas.internal;   # Must match the step-ca certificate CN
    # http2 on;  # Disabled: causes ERR_EMPTY_RESPONSE with some TLS clients

    # TLS configuration
    # Certs issued by step-ca (smallstep/step-ca container).
    # To rotate: docker compose exec step-ca step ca renew /etc/ssl/certs/ingest.crt /etc/ssl/private/ingest.key
    ssl_certificate     /etc/ssl/certs/ingest.crt;
    ssl_certificate_key /etc/ssl/private/ingest.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            DENY                                  always;
    add_header X-Content-Type-Options     nosniff                               always;

    # Gzip for API responses (JSON)
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 512;

    # Default client body size (overridden per location)
    client_max_body_size 10M;

    # ── Health endpoints (no auth required) ───────────────────────────────
    location ~ ^/health(/ready)?$ {
        proxy_pass           http://fastapi_backend;
        proxy_set_header     Host $host;
        proxy_read_timeout   5s;
        proxy_connect_timeout 3s;
    }

    # ── Swagger UI / ReDoc / OpenAPI schema ───────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass       http://fastapi_backend;
        proxy_set_header Host $host;
    }

    # ── Prometheus metrics ────────────────────────────────────────────────
    location /metrics {
        # Allow: Docker internal network, localhost, WireGuard VPN subnet
        allow 172.16.0.0/12;    # Docker bridge networks
        allow 10.10.20.0/24;    # WireGuard VPN subnet (Prometheus scrapes via VPN)
        allow 127.0.0.1;
        deny  all;

        proxy_pass       http://fastapi_backend/metrics;
        proxy_set_header Host $host;
    }

    # ── WebSocket — live status feed ──────────────────────────────────────
    # NOTE: Connect as wss://ingest.dvas.internal/ws/status from any VPN-connected client.
    #       A plain browser HTTP GET will return {"detail":"Not Found"} — this is normal.
    location /ws/ {
        proxy_pass          http://fastapi_backend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;   # Keep WS alive for 1 hour
    }

    # ── Status endpoint — no auth required ───────────────────────────────
    # IMPORTANT: Must come BEFORE the /ingest/ catch-all block below
    location = /ingest/status {
        proxy_pass             http://fastapi_backend;
        proxy_set_header       Authorization   $http_authorization;
        proxy_set_header       Host            $host;
        proxy_set_header       X-Real-IP       $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     10s;
    }

    location ~ ^/ingest/status/ {
        proxy_pass             http://fastapi_backend;
        proxy_set_header       Authorization   $http_authorization;
        proxy_set_header       Host            $host;
        proxy_set_header       X-Real-IP       $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     10s;
    }

    # ── Mission endpoints — no auth guard (FastAPI handles it) ───────────
    # IMPORTANT: Must come BEFORE the /ingest/ catch-all block below
    location /ingest/mission/ {
        proxy_pass             http://fastapi_backend;
        proxy_set_header       Authorization   $http_authorization;
        proxy_set_header       Host            $host;
        proxy_set_header       X-Real-IP       $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     10s;
    }

    # ── Frame ingest endpoint — auth guard + rate limiting ────────────────
    # Catch-all for /ingest/ — must come AFTER specific /ingest/* locations
    location /ingest/ {
        # Rate limiting — allows short bursts from a single drone
        limit_req zone=drone_ingest_limit burst=60 nodelay;
        limit_req_status 429;

        # Reject requests missing Authorization header before hitting FastAPI
        if ($http_authorization = "") {
            add_header Content-Type application/json always;
            return 401 '{"detail":"Authorization header required"}';
        }

        # Proxy settings
        proxy_pass             http://fastapi_backend;
        proxy_set_header       Authorization   $http_authorization;
        proxy_set_header       Host            $host;
        proxy_set_header       X-Real-IP       $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;

        proxy_read_timeout     30s;
        proxy_connect_timeout  5s;
        proxy_send_timeout     30s;

        # Allow up to 10 MB frames
        client_max_body_size   10M;
    }
}
