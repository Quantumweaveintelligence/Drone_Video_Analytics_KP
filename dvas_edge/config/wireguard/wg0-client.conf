# ============================================================
# WireGuard Client Configuration — Windows Edge Laptop
# Kerala Police Drone Video Analytics System
# ============================================================
#
# HOW TO USE THIS FILE
# --------------------
# 1. On the Windows laptop, open the WireGuard app.
# 2. Click "Add Tunnel" → "Add empty tunnel".
# 3. Copy the contents of this file into the tunnel editor.
# 4. Fill in all placeholders marked with < >.
# 5. Share the laptop's Public Key (shown at the top of the editor)
#    with the Ubuntu admin — they add it as a [Peer] block in
#    /etc/wireguard/wg0.conf on the server (or via Headscale).
# 6. Save the tunnel and click "Activate".
# 7. Confirm connectivity: ping 10.10.20.1
#
# NOTE: Keep this file and the private key SECRET.
#       Never commit a filled-in copy to version control.
# ============================================================

[Interface]
# The laptop's WireGuard private key.
# Generated automatically by the WireGuard app when you create a new tunnel.
PrivateKey = gJr2MRlK4eB+3N5c4jIWbqBz/Cy89FT4e02qaduMFnE=

# Unique VPN IP assigned by the administrator for this specific laptop.
# Ubuntu server is always 10.10.20.1  — laptops get .2, .3, .4 …
# Example: Address = 10.10.20.2/24
Address    = 10.10.20.2/24

# Optional: use the Ubuntu server as DNS resolver so that
# "ingest.dvas.internal" resolves without editing C:\Windows\System32\drivers\etc\hosts
# Remove or comment out this line if you are using /etc/hosts on the laptop instead.
DNS        = 10.10.20.1

[Peer]
# Ubuntu ingest server WireGuard gateway public key.
# Obtain this from the Ubuntu admin (contents of /etc/wireguard/server-public.key).
PublicKey  = yWqdahY3jrunVd7HsVYIl9vo72vPUfrEGm2Serlht38=

# Real public IP or DDNS hostname of the Ubuntu server on the internet.
# This is the address the laptop dials out to from the field.
# Example: Endpoint = 203.0.113.42:51820
#          Endpoint = vpn.dvas.kerala.gov.in:51820
Endpoint   =  [2409:40f3:2096:d310:e788:9d0e:5985:7f00]:51820

# Route only the VPN subnet (10.10.20.0/24) through the tunnel.
# All other traffic (internet browsing, etc.) continues through the laptop's
# normal network interface — this is "split tunnelling".
AllowedIPs = 10.10.20.0/24

# Send a keepalive packet every 25 seconds.
# Required when the laptop is behind NAT (field Wi-Fi, 4G hotspot, etc.)
# so the tunnel stays open between frame bursts.
PersistentKeepalive = 25
