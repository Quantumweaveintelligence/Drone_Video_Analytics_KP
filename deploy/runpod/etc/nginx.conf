# DVAS RunPod pod — single public entry point on :80 (RunPod plan 3.4)
# https://<POD_ID>-80.proxy.runpod.net  →  Cloudflare → RunPod LB → this nginx
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/dvas/nginx_error.log warn;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on; tcp_nopush on; keepalive_timeout 65; server_tokens off;
  # $uri, not $request: query strings carry JWTs (?token= on /api/ws, images, SSE) — keep them out of logs
  log_format dvas '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '"$http_user_agent" $request_time';
  access_log /var/log/dvas/nginx_access.log dvas;
  client_max_body_size 100m;                  # Cloudflare in front caps a single request at ~100 MB

  # Real client IP. Measured on RunPod (Phase 5.4, 30 Oct 2026): the request reaches us from
  # the RunPod LB (100.64.x.x) with CF-Connecting-IP = client and X-Forwarded-For =
  # "<anything the client sent>, <client>, <cloudflare edge>". X-Forwarded-For is client-
  # controlled (a spoofed first entry became $remote_addr and the audit-log IP), so only
  # CF-Connecting-IP is used, and only from the LB / private peers (local docker test: no
  # header → the TCP peer). Upstreams get X-Forwarded-For = this one address (below).
  set_real_ip_from 100.64.0.0/10;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;

  # Scheme seen by the browser: RunPod/Cloudflare terminate TLS and send
  # X-Forwarded-Proto=https; a local test (docker run -p 8088:80) has none → http.
  map $http_x_forwarded_proto $dvas_fwd_proto { default $http_x_forwarded_proto; '' $scheme; }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Ingest rate limits (plan D6). Behind the RunPod proxy every edge shares one client IP,
  # so the per-client bucket is keyed on the bearer token (one per operator / edge login;
  # the IP when there is none): 150 r/s covers an operator's 3-4 drones at 30 fps. The
  # per-IP bucket is the overall cap: 600 r/s = 20 drones at 30 fps.
  map $http_authorization $ingest_client { "" $binary_remote_addr; default $http_authorization; }
  limit_req_zone $ingest_client      zone=ingest:20m    rate=150r/s;
  limit_req_zone $binary_remote_addr zone=ingest_ip:10m rate=600r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/s;
  # Video uplink (v2 R1): one long WebSocket per drone, so a connection cap per token, not a rate
  limit_conn_zone $ingest_client zone=video_conn:10m;

  upstream ingest   { server 127.0.0.1:8000; keepalive 64; }
  upstream backend  { server 127.0.0.1:8001; keepalive 64; }
  upstream keycloak { server 127.0.0.1:8080; keepalive 16; }
  upstream go2rtc   { server 127.0.0.1:1984; }

  server {
    listen 80 default_server;
    root /opt/dvas/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # /ingest (no slash) is the admin's SPA page. Without this, nginx answers it with an
    # automatic 301 to /ingest/ (the API location) on the pod's internal address → a reload
    # of the admin dashboard broke (Phase 6). Relative redirects for anything else.
    absolute_redirect off;
    location = /ingest { try_files /index.html =404; add_header Cache-Control "no-store" always; }

    # ── Frame ingest from the edge application ──────────────────────────────
    location /ingest/ {
      limit_req zone=ingest burst=300 nodelay;
      limit_req zone=ingest_ip burst=1200 nodelay;
      limit_req_status 429;
      proxy_pass http://ingest;
      proxy_http_version 1.1;
      proxy_set_header Connection "";                  # keep-alive to the ingest upstream
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;      # replaces the client-supplied chain
      proxy_set_header X-Forwarded-Proto $dvas_fwd_proto;
      client_max_body_size 10m;
      proxy_read_timeout 60s;
      proxy_send_timeout 30s;
    }

    # ── Continuous video uplink from the edge (v2 R1, contract: v2 plan §3) ──
    # H.264 MPEG-TS over one WebSocket per mission; authorised by ingest (bearer token +
    # mission ownership). Long-lived, so no request-rate limit; at most 4 at once per token.
    location = /ingest/video/ws {
      limit_conn video_conn 4;
      limit_conn_status 429;
      proxy_pass http://ingest;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $dvas_fwd_proto;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ── Live video to the dashboard (v2 R2): go2rtc MSE over WebSocket ──────
    # Only the player socket is public, and only with a ticket from /api/live/ticket
    # (checked by the backend via auth_request: user, jurisdiction, stream slot, expiry).
    # go2rtc's API can add stream sources — none of it is reachable from outside.
    location = /live/api/ws {
      auth_request /_live_auth;
      proxy_pass http://go2rtc/api/ws$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host 127.0.0.1;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location /live/ {
      default_type application/json;
      return 404 '{"detail":"Not Found"}';
    }
    location = /_live_auth {
      internal;
      proxy_pass http://backend/api/live/authorize;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
    }

    # The ingest API's read-only status routes have no auth (drone IDs, missions, operators).
    # The dashboard reads them internally through /api/ingest-server/* (login required);
    # the edge needs only frame/mission/incident uploads. Phase 5: they answered publicly.
    location ~ ^/ingest/(status|streams/active) {
      default_type application/json;
      return 404 '{"detail":"Not Found"}';
    }

    # ── Keycloak: token endpoint, JWKS, login theme assets — NOT /admin ─────
    # The master realm (Keycloak admin logins) stays internal, like the admin console
    # (SSH tunnel to 127.0.0.1:8080). Phase 5: it answered publicly → password guessing.
    location ^~ /realms/master {
      default_type application/json;
      return 404 '{"detail":"Not Found"}';
    }
    location ~ ^/(realms|resources)/ {
      limit_req zone=auth burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://keycloak;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;      # replaces the client-supplied chain
      proxy_set_header X-Forwarded-Proto $dvas_fwd_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_buffer_size 64k;
      proxy_buffers 8 64k;
    }

    # ── Dashboard backend (REST, SSE, WebSocket /api/ws) ────────────────────
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;      # replaces the client-supplied chain
      proxy_set_header X-Forwarded-Proto $dvas_fwd_proto;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 300s;
    }

    # The edge API exists only inside the DVAS Edge application on the laptops
    location /edge-api/ {
      default_type application/json;
      return 404 '{"detail":"Edge API is only available in the DVAS Edge application"}';
    }

    # ── React SPA (cloud build) ─────────────────────────────────────────────
    # add_header in a location replaces the server-level ones → repeat the security headers
    location = /index.html {
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /static/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff always;
    }
    location /             { try_files $uri /index.html; }
  }
}
