# DVAS RunPod pod — single public entry point on :80 (RunPod plan 3.4)
# https://<POD_ID>-80.proxy.runpod.net  →  Cloudflare → RunPod LB → this nginx
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/dvas/nginx_error.log warn;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on; tcp_nopush on; keepalive_timeout 65; server_tokens off;
  access_log /var/log/dvas/nginx_access.log;
  client_max_body_size 100m;                  # Cloudflare in front caps a single request at ~100 MB

  # Real client IP from the RunPod/Cloudflare chain. Verify the header in
  # Phase 5.4 (log $http_x_forwarded_for / $http_cf_connecting_ip once).
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Scheme seen by the browser: RunPod/Cloudflare terminate TLS and send
  # X-Forwarded-Proto=https; a local test (docker run -p 8088:80) has none → http.
  map $http_x_forwarded_proto $dvas_fwd_proto { default $http_x_forwarded_proto; '' $scheme; }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # F5: 3 drones x 30 fps from one site share the proxy's client IP → per-IP
  # bucket sized for the whole site with headroom.
  limit_req_zone $binary_remote_addr zone=ingest:10m rate=150r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/s;

  upstream ingest   { server 127.0.0.1:8000; keepalive 64; }
  upstream backend  { server 127.0.0.1:8001; keepalive 64; }
  upstream keycloak { server 127.0.0.1:8080; keepalive 16; }

  server {
    listen 80 default_server;
    root /opt/dvas/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # ── Frame ingest from the edge application ──────────────────────────────
    location /ingest/ {
      limit_req zone=ingest burst=300 nodelay;
      limit_req_status 429;
      proxy_pass http://ingest;
      proxy_http_version 1.1;
      proxy_set_header Connection "";                  # keep-alive to the ingest upstream
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $dvas_fwd_proto;
      client_max_body_size 10m;
      proxy_read_timeout 60s;
      proxy_send_timeout 30s;
    }

    # ── Keycloak: token endpoint, JWKS, login theme assets — NOT /admin ─────
    location ~ ^/(realms|resources)/ {
      limit_req zone=auth burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://keycloak;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $dvas_fwd_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_buffer_size 64k;
      proxy_buffers 8 64k;
    }

    # ── Dashboard backend (REST, SSE, WebSocket /api/ws) ────────────────────
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $dvas_fwd_proto;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 300s;
    }

    # The edge API exists only inside the DVAS Edge application on the laptops
    location /edge-api/ {
      default_type application/json;
      return 404 '{"detail":"Edge API is only available in the DVAS Edge application"}';
    }

    # ── React SPA (cloud build) ─────────────────────────────────────────────
    location = /index.html { add_header Cache-Control "no-store" always; }
    location /static/      { expires 1y; add_header Cache-Control "public, immutable"; }
    location /             { try_files $uri /index.html; }
  }
}
