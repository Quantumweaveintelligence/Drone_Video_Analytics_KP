# DVAS RunPod pod — Valkey (Redis-compatible) configuration (RunPod plan 3.4, fixes F6)
# Frames are transient: no persistence, bounded memory, and only keys WITH a TTL
# may be evicted. Frame streams are bounded by XADD MAXLEN (QUEUE_MAX_LENGTH)
# instead, so mission state / vehicle tracks are never evicted at random.
bind 127.0.0.1
port 6379
protected-mode yes
dir /var/lib/valkey
maxmemory 8gb
maxmemory-policy volatile-lru
appendonly no
save ""
tcp-keepalive 60
daemonize no
logfile ""
