# DVAS RunPod pod — PostgreSQL 16 (RunPod plan 3.4)
# Data directory: /var/lib/postgresql/dvas (container disk). Durability: base backups + continuous
# WAL archive on the network volume /workspace/dvas/pg (bin/pg-volume.sh). Bound to localhost only.
listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/run/postgresql'
hba_file = '/etc/dvas/pg_hba.conf'
max_connections = 300
shared_buffers = 4GB
effective_cache_size = 16GB
work_mem = 16MB
maintenance_work_mem = 512MB
synchronous_commit = off            # may lose <1 s of detections on a crash; never corrupts
wal_compression = on
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_timeout = 15min
max_parallel_workers_per_gather = 0 # avoids /dev/shm usage (container shm can be small)
dynamic_shared_memory_type = posix
log_destination = 'stderr'
logging_collector = off             # supervisord captures stderr
log_min_duration_statement = 500
log_timezone = 'Asia/Kolkata'
timezone = 'Asia/Kolkata'

# WAL archive to the network volume (restore on a fresh container: bin/pg-volume.sh prepare)
wal_level = replica
archive_mode = on
archive_command = '/opt/dvas/deploy/bin/pg-volume.sh archive "%p" "%f"'
archive_timeout = 0                 # segment switches are forced by pg-volume.sh run (PG_WAL_FLUSH_SECS)
wal_recycle = off                   # fresh zero-filled segments → forced switches gzip to a few KB
