# ════════════════════════════════════════════════════════════════════════════
# go2rtc — live video for the dashboard (RunPod v2 plan R1/R2)
# Ingest (video_relay.py) pushes each mission's H.264 over RTSP into one of the fixed
# stream slots below (the slot ↔ mission map lives in Valkey, live:slot:<name>); browsers
# play it through nginx /live/api/ws (MSE over WebSocket, behind auth_request).
# go2rtc only accepts pushes to streams that exist, so the slots are declared here and the
# API never needs to create streams: it is bound to localhost and limited to /api/ws.
# Each slot has a liveNN_sub twin for the grid's 720p sub-stream. 32 slots for up to 20 live
# feeds (plan R9): a freed slot rests 90 s before reuse (LIVE_SLOT_COOLDOWN_S), so reconnects
# and back-to-back missions still find one. Keep in step with LIVE_SLOTS in ingest.
# ════════════════════════════════════════════════════════════════════════════
api:
  listen: "127.0.0.1:1984"
  origin: ""
  allow_paths: [/api/ws]

rtsp:
  listen: "127.0.0.1:8554"

webrtc:
  listen: ""          # no UDP on RunPod; WebRTC only for LAN / on-prem installs (plan R2.6)

log:
  level: info

