[program:gateway]
directory=/analytics
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 127.0.0.1:6379 -- /opt/venvs/gateway/bin/uvicorn gateway.main:app --host 127.0.0.1 --port 8100 --workers 1 --no-access-log
environment=DATABASE_URL="%(ENV_ANALYTICS_DATABASE_URL)s"
priority=45
autorestart=true
startsecs=5
stdout_logfile=/var/log/dvas/gateway.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

[group:analytics]
programs=crowd,person,vehicle,anpr,intrusion,vessel,anomaly,gateway

; ── Dashboard backend (port 8001; 8000 belongs to ingest) ───────────────────
[program:backend]
directory=/opt/dvas/DVAS_Dashboard/backend
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 127.0.0.1:8080 127.0.0.1:6379 -- /opt/venvs/backend/bin/uvicorn server:app --host 127.0.0.1 --port 8001 --workers 1 --proxy-headers --forwarded-allow-ips=127.0.0.1 --no-access-log
environment=DATABASE_URL="%(ENV_DASHBOARD_DATABASE_URL)s",INGEST_SERVER_URL="http://127.0.0.1:8000",EDGE_SYNC_HOSTS="",DVAS_PEER_URL="",EDGE_API_HOST="",DVAS_DISK_PATH="/workspace"
priority=50
autorestart=true
startsecs=10
stdout_logfile=/var/log/dvas/backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -c /etc/dvas/nginx.conf -g "daemon off;"
priority=60
autorestart=true
stdout_logfile=/var/log/dvas/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; ── One-shot bootstrap (every boot, idempotent) + nightly backup loop ───────
[program:bootstrap]
command=/opt/dvas/deploy/bin/dvas-bootstrap.sh
priority=90
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/var/log/dvas/bootstrap.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:backup]
command=/opt/dvas/deploy/bin/backup-loop.sh
priority=95
autorestart=true
stdout_logfile=/var/log/dvas/backup.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
