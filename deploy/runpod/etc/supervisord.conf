[program:intrusion]
directory=/analytics
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 127.0.0.1:6379 127.0.0.1:9000 -- /opt/venvs/ai/bin/uvicorn intrusion.main:app --host 127.0.0.1 --port 8105 --workers 1 --no-access-log
environment=DATABASE_URL="%(ENV_ANALYTICS_DATABASE_URL)s",INTRUSION_MODEL="/analytics/intrusion/models/geotrax_hbb_yolov8s_1920_v1.pt",BUCKET_INTRUSION="dvas-intrusion"
priority=40
autorestart=true
startsecs=20
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/dvas/intrusion.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
