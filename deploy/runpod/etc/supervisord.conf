; ════════════════════════════════════════════════════════════════════════════
; DVAS RunPod pod — supervisord (RunPod plan 3.4)
; One container, ~20 processes. Started by bin/dvas-init.sh (PID 1 = tini).
; Every program inherits the environment exported by dvas-init.sh (secrets from
; /workspace/dvas/secrets/dvas.env, URLs, tunables). Only values that differ per
; program (DATABASE_URL, model paths, buckets) are set here.
; Control:  dvas-ctl status | restart <prog|analytics> | logs <prog>
; ════════════════════════════════════════════════════════════════════════════

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/dvas/supervisord.log
logfile_maxbytes=20MB
logfile_backups=3
pidfile=/run/supervisord.pid
minfds=65536

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ── Platform ────────────────────────────────────────────────────────────────
[program:sshd]
command=/usr/sbin/sshd -D -e
priority=1
autorestart=true
stdout_logfile=/var/log/dvas/sshd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:postgres]
; pg-volume.sh run: postgres on the container disk; on stop it archives the current WAL
; segment to /workspace/dvas/pg/wal first, then does a fast shutdown
command=/opt/dvas/deploy/bin/pg-volume.sh run
user=postgres
priority=10
autorestart=true
stopsignal=TERM
stopwaitsecs=90
stdout_logfile=/var/log/dvas/postgres.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

[program:valkey]
command=/usr/local/bin/valkey-server /etc/dvas/valkey.conf
priority=10
autorestart=true
stdout_logfile=/var/log/dvas/valkey.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

[program:minio]
command=/usr/local/bin/minio server /workspace/dvas/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
environment=MINIO_ROOT_USER="%(ENV_MINIO_ACCESS_KEY)s",MINIO_ROOT_PASSWORD="%(ENV_MINIO_SECRET_KEY)s",MINIO_BROWSER_REDIRECT="off"
priority=10
autorestart=true
stdout_logfile=/var/log/dvas/minio.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true

[program:keycloak]
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 -- /opt/dvas/deploy/bin/keycloak-start.sh
priority=20
autorestart=true
startsecs=30
startretries=10
stopwaitsecs=60
stdout_logfile=/var/log/dvas/keycloak.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

; ── Ingest (1 worker: in-process mission/telemetry state — F7) ──────────────
[program:ingest]
directory=/opt/dvas/dvas_ingest/ingest/api
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:6379 127.0.0.1:8080 -- /opt/venvs/ingest/bin/uvicorn main:app --host 127.0.0.1 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=127.0.0.1 --no-access-log
environment=KEYCLOAK_URL="http://127.0.0.1:8080",REDIS_URL="redis://127.0.0.1:6379/0",LOG_JSON="true"
priority=30
autorestart=true
startsecs=5
stdout_logfile=/var/log/dvas/ingest.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

; ── Analytics (GPU) — group 'analytics' ─────────────────────────────────────
[program:crowd]
directory=/analytics
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 127.0.0.1:6379 127.0.0.1:9000 -- /opt/venvs/ai/bin/uvicorn crowd.main:app --host 127.0.0.1 --port 8101 --workers 1 --no-access-log
environment=DATABASE_URL="%(ENV_ANALYTICS_DATABASE_URL)s",MODEL_PATH="/analytics/crowd/models/PartAmodel_best.pth",BUCKET_HEATMAPS="dvas-heatmaps",BUCKET_EVIDENCE="dvas-evidence"
priority=40
autorestart=true
startsecs=20
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/dvas/crowd.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

[program:person]
directory=/analytics
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 127.0.0.1:6379 127.0.0.1:9000 -- /opt/venvs/ai/bin/uvicorn person.main:app --host 127.0.0.1 --port 8102 --workers 1 --no-access-log
environment=DATABASE_URL="%(ENV_ANALYTICS_DATABASE_URL)s",PERSON_MODEL="/analytics/person/models/yolov8m.pt",FACE_MODEL="/analytics/person/models/yolov8n-face.pt",BUCKET_FACES="dvas-faces",BUCKET_EVIDENCE="dvas-evidence"
priority=40
autorestart=true
startsecs=20
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/dvas/person.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

