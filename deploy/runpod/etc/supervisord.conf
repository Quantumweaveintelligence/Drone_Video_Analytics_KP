[program:anpr]
directory=/analytics
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 127.0.0.1:6379 127.0.0.1:9000 -- /opt/venvs/anpr/bin/uvicorn anpr.main:app --host 127.0.0.1 --port 8104 --workers 1 --no-access-log
environment=DATABASE_URL="%(ENV_ANALYTICS_DATABASE_URL)s",VEHICLE_MODEL="/analytics/anpr/models/visdrone.pt",LP_MODEL="/analytics/anpr/models/license_plate_detector.pt",BUCKET_EVIDENCE="dvas-evidence",BUCKET_FACES="dvas-faces",BUCKET_PLATES="dvas-plates",BUCKET_HEATMAPS="dvas-heatmaps",BUCKET_VEHICLES="dvas-vehicles"
priority=40
autorestart=true
startsecs=20
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/dvas/anpr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
