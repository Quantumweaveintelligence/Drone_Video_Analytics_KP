[program:vessel]
directory=/analytics
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 127.0.0.1:6379 127.0.0.1:9000 -- /opt/venvs/ai/bin/uvicorn vessel.main:app --host 127.0.0.1 --port 8106 --workers 1 --no-access-log
environment=DATABASE_URL="%(ENV_ANALYTICS_DATABASE_URL)s",VESSEL_MODEL_PATH="/analytics/vessel/models/yolov8s.pt",VESSEL_MODEL_TYPE="yolov8",BUCKET_VESSELS_MARITIME="dvas-vessels-maritime"
priority=40
autorestart=true
startsecs=20
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/dvas/vessel.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

[program:anomaly]
directory=/analytics
command=/opt/dvas/deploy/bin/wait-for.sh 127.0.0.1:5432 127.0.0.1:6379 127.0.0.1:9000 -- /opt/venvs/ai/bin/uvicorn anomaly.main:app --host 127.0.0.1 --port 8107 --workers 1 --no-access-log
environment=DATABASE_URL="%(ENV_ANALYTICS_DATABASE_URL)s",ANOMALY_MODEL_PRIMARY="/analytics/anomaly/models/weights/visdrone-yolov11x.pt",ANOMALY_MODEL_SECONDARY="/analytics/anomaly/models/weights/yolo11n.pt",BUCKET_ANOMALY="dvas-anomaly"
priority=40
autorestart=true
startsecs=20
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/dvas/anomaly.log
