environment=DATABASE_URL="%(ENV_ANALYTICS_DATABASE_URL)s",VEHICLE_MODEL="/analytics/vehicle/models/visdrone.pt",BUCKET_VEHICLES="dvas-vehicles",BUCKET_EVIDENCE="dvas-evidence"
